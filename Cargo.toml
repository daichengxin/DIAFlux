[package]
name = "diaflux"
version = "2.0.0"
edition = "2021"
description = "DIAFluX: open-source DIA proteomics data analysis pipeline"
authors = ["Chengxin Dai <daichengxin2011@126.com>"]
license = "Apache-2.0"

[[bin]]
name = "diaflux"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Numerical computing
ndarray = "0.16"
nalgebra = "0.33"
num = "0.4"

# File I/O
csv = "1.3"

# Parquet / Arrow (for spectral library)
arrow = { version = "59", features = ["prettyprint"] }
parquet = "59"

# Memory-mapped files (for Bruker binary reading)
memmap2 = "0.9"

# SQLite for Bruker metadata
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "std"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Parallelism
rayon = "1"

# Utilities
regex = "1"
once_cell = "1"
rand = "0.8"
rand_distr = "0.4"

# Zip archive reading (for .pt model files)
zip = "2"

# Dynamic library loading (for Bruker timsdata.so)
libloading = "0.8"

# Zstd decompression (for Bruker TDF binary, type 2)
zstd = "0.13"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Ordered collections
indexmap = "2"

# mzML parsing
quick-xml = "0.36"
base64 = "0.22"
flate2 = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
